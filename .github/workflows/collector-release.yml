name: Collector release
on:
  workflow_run:
    workflows: [Security]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: crowsnest-collector-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require successful CI on trusted main and an unpublished collector version
        id: prepare
        run: node scripts/collector-release.mjs prepare
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.prepare.outputs.skip != 'true'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.prepare.outputs.skip != 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.prepare.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reuse matching images after an interrupted publication
        if: steps.prepare.outputs.skip != 'true'
        id: image
        run: node scripts/collector-release.mjs inspect
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.prepare.outputs.skip != 'true' && steps.image.outputs.collector_reuse != 'true'
        id: collector
        with:
          context: .
          file: collector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prepare.outputs.collector_image }}:sha-${{ steps.prepare.outputs.sha }}
          provenance: mode=max
          sbom: true
          annotations: index:org.opencontainers.image.revision=${{ steps.prepare.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ steps.prepare.outputs.sha }}
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.prepare.outputs.skip != 'true' && steps.image.outputs.proxy_reuse != 'true'
        id: proxy
        with:
          context: .
          file: collector/Dockerfile.proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prepare.outputs.proxy_image }}:sha-${{ steps.prepare.outputs.sha }}
          provenance: mode=max
          sbom: true
          annotations: index:org.opencontainers.image.revision=${{ steps.prepare.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ steps.prepare.outputs.sha }}
            org.opencontainers.image.licenses=MIT
      - name: Resolve immutable platform manifests from both image indexes
        if: steps.prepare.outputs.skip != 'true'
        id: platforms
        env:
          COLLECTOR_DIGEST: ${{ steps.image.outputs.collector_digest || steps.collector.outputs.digest }}
          PROXY_DIGEST: ${{ steps.image.outputs.proxy_digest || steps.proxy.outputs.digest }}
        run: node scripts/collector-release.mjs platforms
      - name: Smoke test and scan both images on both platforms
        if: steps.prepare.outputs.skip != 'true'
        env:
          EXPECTED_COLLECTOR_VERSION: ${{ steps.prepare.outputs.version }}
          EXPECTED_COLLECTOR_PROTOCOL: ${{ steps.prepare.outputs.protocol }}
          COLLECTOR_IMAGE: ${{ steps.prepare.outputs.collector_image }}
          PROXY_IMAGE: ${{ steps.prepare.outputs.proxy_image }}
          COLLECTOR_AMD64_DIGEST: ${{ steps.platforms.outputs.collector_amd64_digest }}
          COLLECTOR_ARM64_DIGEST: ${{ steps.platforms.outputs.collector_arm64_digest }}
          PROXY_AMD64_DIGEST: ${{ steps.platforms.outputs.proxy_amd64_digest }}
          PROXY_ARM64_DIGEST: ${{ steps.platforms.outputs.proxy_arm64_digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            case "$platform" in
              linux/amd64) collector_digest="$COLLECTOR_AMD64_DIGEST"; proxy_digest="$PROXY_AMD64_DIGEST" ;;
              linux/arm64) collector_digest="$COLLECTOR_ARM64_DIGEST"; proxy_digest="$PROXY_ARM64_DIGEST" ;;
            esac
            docker run --rm --platform "$platform" --network none --read-only \
              --env EXPECTED_COLLECTOR_VERSION --env EXPECTED_COLLECTOR_PROTOCOL \
              --entrypoint python "$COLLECTOR_IMAGE@$collector_digest" \
              -c 'import os,runpy; c=runpy.run_path("/app/collector.py"); assert c["COLLECTOR_VERSION"] == os.environ["EXPECTED_COLLECTOR_VERSION"]; assert int(c["COLLECTOR_PROTOCOL"]) == int(os.environ["EXPECTED_COLLECTOR_PROTOCOL"])'
            docker run --rm --platform "$platform" --network none --read-only \
              --entrypoint haproxy "$PROXY_IMAGE@$proxy_digest" \
              -c -f /usr/local/etc/haproxy/haproxy.cfg
            for reference in "$COLLECTOR_IMAGE@$collector_digest" "$PROXY_IMAGE@$proxy_digest"; do
              docker run --rm --env TRIVY_USERNAME --env TRIVY_PASSWORD \
                aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
                image --image-src remote --platform "$platform" --scanners vuln \
                --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$reference"
            done
          done
      - name: Publish immutable image tags, manifest, and collector management archive
        if: steps.prepare.outputs.skip != 'true'
        env:
          COLLECTOR_DIGEST: ${{ steps.image.outputs.collector_digest || steps.collector.outputs.digest }}
          PROXY_DIGEST: ${{ steps.image.outputs.proxy_digest || steps.proxy.outputs.digest }}
        run: node scripts/collector-release.mjs publish
