name: crowsnest-collector
services:
  socket-proxy:
    container_name: crowsnest-socket-proxy
    image: "${PROXY_IMAGE:?Set a release digest in PROXY_IMAGE}"
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-internal]
    mem_limit: 32m
    cpus: 0.25
    pids_limit: 16
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
  collector:
    container_name: crowsnest-collector
    image: "${COLLECTOR_IMAGE:?Set a release digest in COLLECTOR_IMAGE}"
    user: "${COLLECTOR_UID:?Set COLLECTOR_UID in .env}:${COLLECTOR_GID:?Set COLLECTOR_GID in .env}"
    restart: unless-stopped
    command: [python, -u, /app/collector.py]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./collector.json:/run/config/collector.json:ro
      - ./.crowsnest/status:/run/crowsnest:ro
    depends_on: [socket-proxy]
    networks: [docker-internal, outbound]
    mem_limit: 96m
    cpus: 0.35
    pids_limit: 32
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=1m,mode=1777"]
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; p=pathlib.Path('/tmp/crowsnest-last-success'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime<180 else 1)"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 120s
networks:
  docker-internal:
    internal: true
  outbound: {}
