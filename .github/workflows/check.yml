name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require versions for changed collector release inputs
        run: node scripts/check-collector-changes.mjs
      - run: npm run check
  container:
    name: Standalone Docker deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: docker build --tag crowsnest:ci .
      - run: node scripts/check-docker.mjs crowsnest:ci
      - run: node scripts/check-proxy.mjs
  collector-images:
    name: Collector image packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --file collector/Dockerfile --tag crowsnest-collector:ci .
      - run: docker build --file collector/Dockerfile.proxy --tag crowsnest-socket-proxy:ci .
      - name: Validate packaged collector and restricted proxy
        run: |
          read -r collector_version collector_protocol < <(python3 -c "import json; m=json.load(open('collector/version.json')); print(m['version'],m['protocol'])")
          docker run --rm --network none --entrypoint python \
            --env "EXPECTED_COLLECTOR_VERSION=$collector_version" --env "EXPECTED_COLLECTOR_PROTOCOL=$collector_protocol" crowsnest-collector:ci \
            -c "import os,runpy; c=runpy.run_path('/app/collector.py'); assert c['COLLECTOR_VERSION'] == os.environ['EXPECTED_COLLECTOR_VERSION']; assert int(c['COLLECTOR_PROTOCOL']) == int(os.environ['EXPECTED_COLLECTOR_PROTOCOL'])"
          docker run --rm --network none crowsnest-socket-proxy:ci \
            haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg
      - name: Verify actual migration, report delivery, and rollback
        run: python3 scripts/check-updater-docker.py
      - name: Scan packaged collector and proxy for fixable vulnerabilities
        run: |
          for image in crowsnest-collector:ci crowsnest-socket-proxy:ci; do
            docker save "$image" --output "$RUNNER_TEMP/collector-image.tar"
            docker run --rm \
              --volume "$RUNNER_TEMP/collector-image.tar:/image.tar:ro" \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --input /image.tar --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 --no-progress
          done
