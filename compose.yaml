name: crowsnest
services:
  crowsnest:
    build: .
    image: crowsnest:0.11.0
    container_name: crowsnest
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${CROWSNEST_HTTP_PORT:-8080}:8080"
    environment:
      CROWSNEST_PUBLIC_URL: ${CROWSNEST_PUBLIC_URL:?Set CROWSNEST_PUBLIC_URL in .env to your HTTPS dashboard origin}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_ENABLED: ${NTFY_ENABLED:-false}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - crowsnest-data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
volumes:
  crowsnest-data:
