name: crowsnest-notifier
services:
  notifier:
    image: python:3.13.17-alpine@sha256:bf12ecc0bea3f171d55145dd02c78b5eeb09f30ee2ac9cc2b4c9e4e8f5e30741
    container_name: crowsnest-notifier
    restart: unless-stopped
    user: "${NOTIFIER_UID:?Set NOTIFIER_UID}:${NOTIFIER_GID:?Set NOTIFIER_GID}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./notifier.py:/app/notifier.py:ro
      - ./notifier.json:/config/notifier.json:ro
    command: [python, /app/notifier.py]
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=1m,mode=1777"]
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; p=pathlib.Path('/tmp/crowsnest-last-success'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime<420 else 1)"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 120s
