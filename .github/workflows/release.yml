name: Release
on:
  workflow_run:
    workflows: [Security]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: crowsnest-release
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require matching successful CI and an unreleased version
        id: prepare
        run: node scripts/release.mjs prepare
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.prepare.outputs.skip != 'true'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.prepare.outputs.skip != 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.prepare.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reuse an already published matching image after an interrupted release
        id: image
        if: steps.prepare.outputs.skip != 'true'
        run: node scripts/release.mjs inspect
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.prepare.outputs.skip != 'true' && steps.image.outputs.reuse != 'true'
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prepare.outputs.image }}:sha-${{ steps.prepare.outputs.sha }}
          provenance: mode=max
          sbom: true
          annotations: index:org.opencontainers.image.revision=${{ steps.prepare.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ steps.prepare.outputs.sha }}
            org.opencontainers.image.licenses=MIT
      - name: Test both platform images and fail on fixable high/critical vulnerabilities
        if: steps.prepare.outputs.skip != 'true'
        env:
          RELEASE_IMAGE: ${{ steps.prepare.outputs.image }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest || steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$RELEASE_IMAGE@$RELEASE_DIGEST"
            DOCKER_DEFAULT_PLATFORM="$platform" node scripts/check-docker.mjs "$RELEASE_IMAGE@$RELEASE_DIGEST"
            docker run --rm --env TRIVY_USERNAME --env TRIVY_PASSWORD \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --image-src remote --platform "$platform" --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              "$RELEASE_IMAGE@$RELEASE_DIGEST"
          done
      - name: Publish the tested digest, immutable version tag, and release assets
        if: steps.prepare.outputs.skip != 'true'
        env:
          RELEASE_DIGEST: ${{ steps.image.outputs.digest || steps.build.outputs.digest }}
        run: node scripts/release.mjs publish
