name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    name: Secrets and Git history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan complete Git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all" .'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/check-secrets.mjs --history
      - name: Audit npm dependency metadata
        run: npm audit --audit-level=high
  static-analysis:
    name: Application security rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan Worker, UI, and collector
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/src:ro" --workdir /src \
            --entrypoint semgrep \
            semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 \
            scan --config /src/.semgrep.yml --error --metrics off --disable-version-check
  container-vulnerabilities:
    name: Container vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag crowsnest:security .
      - name: Export image without exposing the Docker socket to the scanner
        run: docker save crowsnest:security --output "$RUNNER_TEMP/crowsnest-image.tar"
      - name: Fail on fixable high and critical vulnerabilities
        run: |
          docker run --rm \
            --volume "$RUNNER_TEMP/crowsnest-image.tar:/image.tar:ro" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --input /image.tar --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress
