global
    log stdout format raw local0
    maxconn 32
    # Keep CPU-affinity auto-sizing within the container PID and CPU limits.
    nbthread 1
defaults
    mode http
    timeout connect 5s
    timeout client 15s
    timeout server 15s
frontend docker_read
    bind :2375
    acl is_get method GET
    acl allowed_path path_reg ^/version$ ^/v[0-9]+\.[0-9]+/containers/json$ ^/v[0-9]+\.[0-9]+/containers/[a-f0-9]{64}/json$
    acl stats_path path_reg ^/v[0-9]+\.[0-9]+/containers/[a-f0-9]{64}/stats$
    acl bounded_stats query -m str stream=false&one-shot=true
    http-request deny deny_status 403 unless is_get
    http-request deny deny_status 403 unless allowed_path or stats_path bounded_stats
    default_backend local_docker
backend local_docker
    server docker /var/run/docker.sock
